plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'com.gymos.support'
    compileSdk 36
    defaultConfig { applicationId 'com.gymos.support'; minSdk 26; targetSdk 36; versionCode 8; versionName '1.0.7' }
    buildFeatures { buildConfig true }
    // Reproducible target flavors: production is the committed default;
    // freshtest points the same reviewed source at the fresh Supabase build
    // with a coexisting applicationId. WEB_HOST/SUPABASE_HOST are the single
    // origin sources for Java (BuildConfig); no auth App Links exist here.
    flavorDimensions += ['target']
    productFlavors {
        production {
            dimension 'target'
            buildConfigField 'String', 'WEB_HOST', '"gymeg.vercel.app"'
            buildConfigField 'String', 'SUPABASE_HOST', '"frsstuqstutbflkaffcx.supabase.co"'
        }
        freshtest {
            dimension 'target'
            applicationIdSuffix '.freshtest'
            buildConfigField 'String', 'WEB_HOST', '"gymeg-supabase.vercel.app"'
            buildConfigField 'String', 'SUPABASE_HOST', '"aynycpumwcopbnkbkqhr.supabase.co"'
        }
    }
    signingConfigs { release { storeFile file(System.getenv('GYMEG_KEYSTORE') ?: 'missing-keystore.jks'); storePassword System.getenv('GYMEG_KEYSTORE_PASSWORD'); keyAlias System.getenv('GYMEG_KEY_ALIAS'); keyPassword System.getenv('GYMEG_KEYSTORE_PASSWORD') } }
    buildTypes { release { signingConfig signingConfigs.release } }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}
