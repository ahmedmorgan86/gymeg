name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gymeg-windows-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Windows package
        id: build
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/GymOS.Windows.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Windows package version.' }
          $output = Join-Path $env:RUNNER_TEMP "gymeg-windows-$version"
          dotnet publish windows/GymOS.Windows.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
          $package = Join-Path $output 'GymOS.exe'
          if (-not (Test-Path -LiteralPath $package)) { throw 'Published Windows executable is missing.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload package to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          WINDOWS_VERSION: ${{ steps.build.outputs.version }}
          WINDOWS_PACKAGE_PATH: ${{ steps.build.outputs.package }}
        run: node scripts/publish-windows-release.mjs
