name: Application quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Verify published app version and APK checksums
        run: npm run release:check
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Verify Android release signatures and original publisher
        run: node scripts/verify-android-signatures.mjs
      - run: npm run build
  windows-devices:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native inventory classification and bridge boundaries
        run: dotnet run --project tests/windows-devices/DevicesSmoke.csproj -c Release
      - name: Windows desktop build
        run: dotnet build windows/GymOS.Windows.csproj -c Release
      - name: Publish GYMEG Windows package
        run: dotnet publish windows/GymOS.Windows.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -o windows/gymeg-release
      - uses: actions/upload-artifact@v4
        with:
          name: GYMEG-Windows-x64
          path: windows/gymeg-release/
          retention-days: 30
